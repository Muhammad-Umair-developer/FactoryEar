name: CD - Docker Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-images:
    name: Build Backend & Frontend Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: factory-ear-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Nginx Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: factory-ear-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: factory-ear-api
    ports:
      - "8000:8000"
    volumes:
      # Mount trained PyTorch weights read-only without baking large binaries into the image
      - ./ml_pipeline/saved_models:/app/ml_pipeline/saved_models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: factory-ear-ui
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped